# ExpenseGuard pre-commit 钩子
#
# 安装（本项目已有 uv，不必再引入 pipx）：
#   uv tool install pre-commit
#   pre-commit install
# 全量跑：pre-commit run --all-files
#
# 设计原则:这里只放**能在本地秒级完成、且失败即代表确定性错误**的检查。
# 类型检查与测试留给 CI —— 把它们塞进 pre-commit 会让每次提交等十几秒，
# 结果是团队集体养成 `--no-verify` 的习惯，连 secret 扫描一起绕过。

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # ---------------------------------------------------------------
  # 后端：格式化与 lint
  # 用本地 hook 走 uv，而不是 mirrors-ruff —— 那样 ruff 版本由
  # pyproject.toml/uv.lock 唯一决定，不会出现「本地 hook 版本与 CI 版本
  # 不一致，同一份代码一边过一边红」这种最消耗信任的情况。
  # ---------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format
        language: system
        types_or: [python, pyi]
        files: ^backend/

      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^backend/

      # ---------------------------------------------------------------
      # 脱敏硬约束的物理拦截。
      #
      # `.gitignore` 挡不住 `git add -f`，也挡不住有人手滑把真实报销数据
      # 拷进 tenants/ 之后用 IDE 提交。这个 hook 直接让提交失败。
      # ---------------------------------------------------------------
      # language: fail 是 pre-commit 内建的「匹配到就报错」类型，
      # 它会把命中的文件名一并打出来。比自己写 shell 稳:不依赖
      # bash 的存在，也不受 Windows 下引号转义的折腾。
      - id: block-private-paths
        name: 拒绝 tenants/ 与 data/private/ 进入暂存区
        entry: 这些路径属于客户数据层，永不进仓库（脱敏 = 删目录，而非事后重写历史）
        language: fail
        files: ^(tenants/|data/private/)

  # ---------------------------------------------------------------
  # 密钥扫描
  # 选 gitleaks 而非 detect-secrets：后者要维护 .secrets.baseline，
  # 每次误报都得重扫并提交基线文件，长期是纯维护税。
  # gitleaks 是单个 Go 二进制、零状态。
  # ---------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------
  # 通用卫生
  # ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 真实月度报销 xlsx 动辄几 MB。这条是「误 git add 了客户数据」
      # 在文件大小维度上的第二道物理拦截。
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        # tsconfig*.json 是 **JSONC**（TypeScript 官方允许注释），
        # 标准 JSON 解析器一定会报错。排除它们，而不是为了迁就一个
        # 检查器把配置里的解释性注释全删掉。
        exclude: ^(openapi\.json|frontend/(package-lock|tsconfig.*)\.json)$
      - id: end-of-file-fixer
        exclude: ^(openapi\.json|frontend/src/api/schema\.d\.ts|.*\.xlsx)$
      - id: trailing-whitespace
        exclude: ^(openapi\.json|frontend/src/api/schema\.d\.ts|.*\.xlsx)$
      # 刻意**不装** mixed-line-ending：`.gitattributes` 的
      # `* text=auto eol=lf` 已经在入库时统一了行尾，仓库里存的永远是 LF。
      # 再加一个改工作区文件的钩子只会制造大片无意义 diff——两者管的
      # 根本不是同一层（一个管仓库内容，一个管本地文件）。

  # ---------------------------------------------------------------
  # 前端：Prettier
  # 同样走 local hook 用仓库自己的 node_modules，版本与 CI 一致。
  # ---------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend exec -- prettier --write
        language: system
        files: ^frontend/.*\.(ts|tsx|css|html|json|md)$
        exclude: ^frontend/(package-lock\.json|src/api/schema\.d\.ts)$
