[project]
name = "expenseguard-backend"
version = "0.1.0"
description = "ExpenseGuard —— 面向内部财务团队的费用报销预审系统（后端）"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    # —— Web 框架 ——
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.12,<1",
    # 运行时依赖:健康检查要探测 Qdrant 的 /readyz。
    # （它同时也是测试用的 ASGI 客户端，但不能只放 dev 组——
    #   那样生产镜像里就没有它，启动即 ImportError。）
    "httpx>=0.27,<1",
    # —— 校验与配置 ——
    # 同一 Pydantic 模型既约束 LLM 结构化输出，又作 API 响应模型，避免双定义漂移
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # —— 数据库 ——
    # 全栈统一 psycopg3：langgraph-checkpoint-postgres 要求 psycopg3，
    # 且 psycopg2 在 Python 3.13 的 wheel 滞后。同一 dialect 名同时支持同步/异步，
    # 因此 Alembic（同步）与应用（异步）共用一个驱动，不引入 asyncpg。
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary,pool]>=3.2.3,<4",
    # —— 安全 ——
    # 不用 passlib：它顶层 import crypt，而 crypt 在 Python 3.13 已被 PEP 594 移除，
    # 会直接 ImportError；且 passlib 已停止维护。
    "argon2-cffi>=23.1,<26",
    # —— 编排与检索（快速演进，锁次版本；版本由 uv.lock 回填）——
    "langgraph>=1.0.0,<1.1",
    "langgraph-checkpoint-postgres>=3.0.0,<3.1",
    "qdrant-client>=1.16,<1.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "testcontainers[postgres]>=4.8,<5",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

# 这是应用而非库，不安装进 site-packages。
# 好处：规避 db / core 这类通用顶层包名与 PyPI 同名包冲突。
[tool.uv]
package = false

# ============================================================
# Ruff —— lint + format
# ============================================================
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations —— 强制类型注解
    "ASYNC",
    "S",   # flake8-bandit
    "T20", # 禁止 print
    "RUF",
]

ignore = [
    # 本项目全部文档与注释使用中文。RUF001/002/003 会把全角标点（，。：）
    # 判定为「与 ASCII 形近的歧义字符」并逐个报错——对中文项目是纯噪音，
    # 且会诱导把中文标点改成半角，反而降低可读性。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试里 assert 是正常写法；测试函数不强制返回类型注解；
# S105/S106 是「硬编码密码」——测试夹具里的假密码是刻意的，
# 真实密码哈希由 argon2 生成且从不出现在源码里
"tests/**" = ["S101", "S105", "S106", "ANN"]
# 迁移文件由 Alembic 生成，不强制注解与行长
"app/db/migrations/versions/*" = ["ANN", "E501"]
# env.py 的 include_object 必须匹配 Alembic 定义的回调签名，
# 其中 obj / compare_to 在 Alembic 侧就是无约束类型，只能用 Any。
"app/db/migrations/env.py" = ["ANN401"]

# ============================================================
# mypy —— strict
# ruff 的 ANN 只强制「写了注解」，不检查注解是否正确。
# AGENTS.md 的「全量 type hints」硬约束只有 mypy strict 能兑现。
# ============================================================
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# 平台条件代码:mypy 会把 sys.platform 当成检查所在平台的常量，
# 于是另一个平台的分支必然被判为 unreachable。这不是真问题——
# 那段代码在对应平台上是要跑的。
[[tool.mypy.overrides]]
module = ["app.asyncio_compat"]
warn_unreachable = false

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-asyncio 在 0.23→1.0 之间 event-loop 作用域语义反复变更，
# 典型症状是 "attached to a different loop"。显式固定作用域。
asyncio_default_fixture_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "unit: 纯逻辑单元测试",
    "integration: 需要真实数据库的集成测试",
    "slow: 耗时测试（进程 kill/重启等）",
    "eval: LLM 评测门禁用例（CI 单独 job）",
]
